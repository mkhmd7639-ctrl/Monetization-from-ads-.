<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مسابقة شبكة الطوفان نت - إرسال للإيميل</title>
    <!-- مكتبة EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            // Public Key الخاص بك
            emailjs.init("fZag-1wa6YZsRJKeb");
        })();
    </script>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: auto;
        }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
            font-size: 16px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 95%;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #0056b3;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>مسابقة شبكة الطوفان نت</h2>
    
    <!-- خطوة إدخال الإيميل وإرسال الرمز الحقيقي -->
    <div id="step-email">
        <p>أدخل بريدك الإلكتروني (Gmail) لاستلام رمز التحقق الفعلي:</p>
        <input type="email" id="user-email" placeholder="example@gmail.com" required>
        <button onclick="sendRealOTP()">إرسال الرمز إلى الإيميل</button>
    </div>

    <!-- خطوة إدخال الرمز المستلم -->
    <div id="step-verify" class="hidden">
        <p>تم إرسال الرمز إلى بريدك الإلكتروني بنجاح، تفقد صندوق الوارد أو (Spam)، واكتب الرمز هنا:</p>
        <input type="text" id="entered-otp" placeholder="أدخل الرمز المكون من 5 أرقام" maxlength="5">
        <button onclick="verifyCode()">تأكيد الرمز والمشاركة</button>
    </div>
</div>

<script>
    let myGeneratedOTP = "";

    function sendRealOTP() {
        const emailInput = document.getElementById("user-email").value.trim();
        
        if(!emailInput || !emailInput.includes('@')) {
            alert("الرجاء إدخال بريد إلكتروني صحيح!");
            return;
        }

        // توليد رمز عشوائي مكون من 5 أرقام
        myGeneratedOTP = Math.floor(10000 + Math.random() * 90000).toString();

        // المتظريات التي ستطابق القالب الذي أنشأناه (email و pass_code)
        var templateParams = {
            email: emailInput,
            pass_code: myGeneratedOTP
        };

        // زر مؤقت يوضح جاري الإرسال
        const btn = event.target;
        btn.innerText = "جاري الإرسال عبر السيرفر...";
        btn.disabled = true;

        // إرسال البيانات عبر خدمة EmailJS التي قمت بربطها
        emailjs.send('service_wpecg0t', 'template_t6xzhot', templateParams)
            .then(function(response) {
                console.log('SUCCESS!', response.status, response.text);
                alert('تم إرسال الرمز إلى بريدك (' + emailInput + ') بنجاح! تفقد بريدك الآن.');
                
                // الانتقال لخطوة إدخال الرمز
                document.getElementById("step-email").classList.add("hidden");
                document.getElementById("step-verify").classList.remove("hidden");
            }, function(error) {
                console.log('FAILED...', error);
                alert('فشل الإرسال. تأكد أن خدمة الجيميل في EmailJS متصلة بشكل صحيح.');
                btn.innerText = "إرسال الرمز إلى الإيميل";
                btn.disabled = false;
            });
    }

    function verifyCode() {
        const userInput = document.getElementById("entered-otp").value.trim();

        if(userInput === myGeneratedOTP) {
            alert('مبروك يا ميثاق! تم التحقق من الإيميل وتسجيلك في المسابقة بنجاح.');
            location.reload();
        } else {
            alert('رمز التحقق غير صحيح، تأكد من الرقم الذي وصلك على البريد.');
        }
    }
</script>

</body>
</html>
