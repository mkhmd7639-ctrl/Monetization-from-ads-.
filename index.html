<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة ميثاق محمد الإلكترونية</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #1e3d59;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #2b2b2b;
            --text-light: #666666;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: linear-gradient(135deg, var(--primary), #172a3a); color: white; padding: 25px 20px; text-align: center; }
        .container { max-width: 500px; width: 90%; margin: 40px auto; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 8px; font-size: 1.4rem; }
        .subtitle { text-align: center; color: var(--text-light); font-size: 0.95rem; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 6px; font-size: 0.9rem; font-weight: 500; }
        .input-group input { width: 100%; padding: 12px 15px; border: 1.5px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        .btn-primary { background-color: var(--primary); color: white; }
        .btn-google { background-color: #ffffff; color: #444; border: 1.5px solid var(--border); }
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: var(--text-light); font-size: 0.85rem; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .divider span { padding: 0 10px; }
        .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid var(--border); }
        .tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: 700; color: var(--text-light); }
        .tab.active { color: var(--primary); border-bottom: 3px solid var(--primary); }
        .form-content { display: none; }
        .form-content.active { display: block; }
        .welcome-card { text-align: center; padding: 20px 0; }
        .user-info { background: #f0f4f8; padding: 12px; border-radius: 8px; margin: 15px 0; word-break: break-all; }
        .btn-logout { background-color: #e74c3c; color: white; }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signInWithEmailAndPassword,
            createUserWithEmailAndPassword,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDzumyzrRWRF0RmINVV8v1DrEM6BVA2x44",
            authDomain: "methaq-library.firebaseapp.com",
            projectId: "methaq-library",
            storageBucket: "methaq-library.firebasestorage.app",
            messagingSenderId: "610105853531",
            appId: "1:610105853531:web:e7bf39c6ec556df6d6e17e",
            measurementId: "G-RB720ERKZH"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-card').style.display = 'none';
                document.getElementById('user-card').style.display = 'block';
                document.getElementById('user-identity').innerText = user.displayName || user.email;
            } else {
                document.getElementById('auth-card').style.display = 'block';
                document.getElementById('user-card').style.display = 'none';
            }
        });

        window.loginWithGoogle = async () => {
            try {
                await signInWithPopup(auth, new GoogleAuthProvider());
            } catch (error) {
                alert("خطأ في تسجيل الدخول عبر Google: " + error.message);
            }
        };

        window.handleEmailAuth = async (actionType) => {
            const email = document.getElementById('email-input').value.trim();
            const password = document.getElementById('password-input').value;

            if (!email || !password) {
                alert("يرجى كتابة البريد الإلكتروني وكلمة المرور بشكل صحيح!");
                return;
            }

            try {
                if (actionType === 'login') {
                    await signInWithEmailAndPassword(auth, email, password);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                    alert("تم إنشاء الحساب بنجاح وتم تسجيل دخولك!");
                }
            } catch (error) {
                if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-credential') {
                    alert("هذا البريد غير مسجل مسبقاً، يرجى الضغط على زر 'إنشاء حساب جديد'.");
                } else if (error.code === 'auth/email-already-in-use') {
                    alert("هذا البريد مسجل بالفعل، اضغط على 'تسجيل الدخول'.");
                } else if (error.code === 'auth/weak-password') {
                    alert("كلمة المرور ضعيفة، يجب أن تكون 6 أحرف أو أرقام على الأقل.");
                } else {
                    alert("خطأ: " + error.message);
                }
            }
        };

        window.logout = () => signOut(auth);
    </script>
</head>
<body>
    <header>
        <h1>مكتبة ميثاق محمد الإلكترونية</h1>
    </header>

    <div class="container">
        <div id="auth-card">
            <h2>مرحباً بك</h2>
            <p class="subtitle">قم بتسجيل الدخول للوصول إلى محتوى المكتبة</p>

            <button class="btn btn-google" onclick="loginWithGoogle()">متابعة باستخدام Google</button>

            <div class="divider"><span>أو بالبريد الإلكتروني</span></div>

            <div id="email-tab" class="form-content active">
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" id="email-input" placeholder="example@gmail.com">
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" id="password-input" placeholder="••••••••">
                </div>
                <button class="btn btn-primary" onclick="handleEmailAuth('login')">تسجيل الدخول</button>
                <button class="btn" style="background:#e2e8f0; color:#333; margin-top: 8px;" onclick="handleEmailAuth('register')">إنشاء حساب جديد</button>
            </div>
        </div>

        <div id="user-card" style="display: none;">
            <div class="welcome-card">
                <h3>أهلاً وسهلاً بك في المكتبة!</h3>
                <p>تم تسجيل دخولك بنجاح بواسطة:</p>
                <div class="user-info" id="user-identity"></div>
                <button class="btn btn-logout" onclick="logout()">تسجيل الخروج</button>
            </div>
        </div>
    </div>
</body>
</html>
